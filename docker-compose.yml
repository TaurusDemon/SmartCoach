version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartcoach-postgres
    restart: always
    environment:
      POSTGRES_DB: smartcoach_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: smartcoach-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@smartcoach.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data: