name: SmartCoach CI - Build & Test

on:
  push:
    branches: ["master", "desarrollo"]
  pull_request:
    branches: ["master", "desarrollo"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build Java 17 & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar con maven
        run: mvn clean compile

      - name: Ejecutar Tests Unitarios + Integracion
        run: mvn test

      - name: Configurar Docker Buildx
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry (GHCR)
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos para Docker (Tags y Labels)
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Construir y publicar Imagen Docker en GHCR
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}