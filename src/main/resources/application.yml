spring:
  application:
    name: smartcoach-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/smartcoach_db
    username: postgres
    password: secretpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # Hibernate creará automáticamente las tablas
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  springdoc:
    swagger-ui:
      path: /swagger-ui.html
      operationsSorter: method # Ordena los endpoints por método HTTP (GET, POST, etc.)
    api-docs:
      path: /v3/api-docs

  ai:
    google:
      genai:
        api-key: AQ.Ab8RN6LDqjkg6k4IYK4-E7pPTJZy7wWPl_97iBhI-2cYptSTSQ
        chat:
          options:
            model: gemini-3.8-flash
            temperature: 0.7

jwt:
  secret: SmartCoachKeySecretSuperSecureForJWTTokenGeneration2026!
  expiration-ms: 86400000