spring:
  application:
    name: smartcoach-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/smartcoach_db
    username: postgres
    password: secretpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # Hibernate creará automáticamente las tablas
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  springdoc:
    swagger-ui:
      path: /swagger-ui.html
      operationsSorter: method # Ordena los endpoints por método HTTP (GET, POST, etc.)
    api-docs:
      path: /v3/api-docs

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.8-flash
            temperature: 0.7

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 300000