spring:
  datasource:
    url: jdbc:h2:mem:smartcoachtestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  ai:
    google:
      genai:
        # Sustituye a GEMINI_API_KEY para que `mvn test` funcione en cualquier maquina
        # sin exportar variables de entorno. Nunca usar un valor real aqui.
        api-key: dummy-api-key-for-tests
        chat:
          options:
            model: gemini-3.8-flash
            temperature: 0.7

# Clave HMAC >= 32 bytes para que Keys.hmacShaKeyFor(...) no lance WeakKeyException.
jwt:
  secret: UnitTestOnlySecretWithAtLeast32BytesOfEntropy!
  expiration-ms: 3600000
